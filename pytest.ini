[pytest]
testpaths = tests
python_files = test_*.py
pythonpath = .

addopts =
    -v
    --browser chromium
    --base-url http://localhost:8080/parabank/
    --tracing retain-on-failure
    --screenshot only-on-failure
markers =
    smoke: fast checks that prove the app and framework are alive
    ui_tests: browser tests
    api: HTTP tests with no browser